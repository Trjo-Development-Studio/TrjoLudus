[build-system]
requires = ["setuptools>=77"]  # PEP 639 SPDX `license` string support
build-backend = "setuptools.build_meta"

[project]
name = "trjoludus"
description = "A Python library for building 2D games entirely through code."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Trjo Development Studio" }]
keywords = ["game", "engine", "2d", "gamedev"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# TrjoLudus has no runtime dependencies and is intended to keep it that way.
# Platform access is done directly through ctypes against OS libraries.
dependencies = []

dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Trjo-Development-Studio/TrjoLudus"
Source = "https://github.com/Trjo-Development-Studio/TrjoLudus"

[tool.setuptools.dynamic]
version = { attr = "trjoludus.__version__" }

[tool.setuptools.packages.find]
include = ["trjoludus*"]

# The native library is deliberately NOT listed as package data. It is not a
# file that sits in the source tree waiting to be copied: it is compiled from
# rust/ during the build and written straight into the build directory by
# setup.py, so that a developer's leftover build can never end up in a
# release. See setup.py, and rust/README.md for building it by hand.
