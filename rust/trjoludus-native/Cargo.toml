[package]
name = "trjoludus-native"
description = "Native implementations of TrjoLudus subsystems."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# A plain C ABI shared library, loaded with ctypes exactly as TrjoLudus loads
# libX11 and user32. Not a Python extension module: that would tie a build to
# one Python version and make the engine stop being pure Python when no
# library is present.
name = "trjoludus_native"
crate-type = ["cdylib"]

[dependencies]
# None, and that is deliberate. TrjoLudus has no third-party dependencies on
# the Python side either.
